<script>
// ---- フリック配列 [中央, 左, 上, 右, 下] ----
const KEYS = [
  {id:"a",  c:["あ","い","う","え","お"]}, {id:"ka", c:["か","き","く","け","こ"]}, {id:"sa", c:["さ","し","す","せ","そ"]},
  {id:"ta", c:["た","ち","つ","て","と"]}, {id:"na", c:["な","に","ぬ","ね","の"]}, {id:"ha", c:["は","ひ","ふ","へ","ほ"]},
  {id:"ma", c:["ま","み","む","め","も"]}, {id:"ya", c:["や","（","ゆ","）","よ"]}, {id:"ra", c:["ら","り","る","れ","ろ"]},
  {id:"mod", mod:true, label:"小゛゜", c:["⇄","゛","小","゜",""]},
  {id:"wa", c:["わ","を","ん","ー",""]},
  {id:"pu", fn:true, label:"、。?!", c:["、","。","？","！",""]},
];
const DIR_ARROW = ["","←","↑","→","↓"];
const MOD_MODES = ["cycle","daku","small","handaku",null];

// 濁点・半濁点・小さい字の切り替え順（iOS と同じ並び）
const GROUPS = "かが きぎ くぐ けげ こご さざ しじ すず せぜ そぞ ただ ちぢ つっづ てで とど はばぱ ひびぴ ふぶぷ へべぺ ほぼぽ あぁ いぃ うぅゔ えぇ おぉ やゃ ゆゅ よょ わゎ".split(" ").map(s=>[...s]);
const VAR = {}, BASE = {}, VTYPE = {};
for (const g of GROUPS) for (const ch of g) {
  VAR[ch] = g; BASE[ch] = g[0];
  VTYPE[ch] = ch===g[0] ? "base" : "ぁぃぅぇぉっゃゅょゎ".includes(ch) ? "small" : "ぱぴぷぺぽ".includes(ch) ? "handaku" : "daku";
}
const KEYPOS = {};
KEYS.forEach(k => { if (!k.mod) k.c.forEach((ch,d) => { if (ch) KEYPOS[ch] = {id:k.id, dir:d}; }); });

// 全単語が打てるか起動時に確認
for (const [, r] of STATIONS) for (const ch of r)
  if (!KEYPOS[BASE[ch] || ch]) console.warn("打てない字:", ch, r);

const kbdEl = document.getElementById("kbd");
const popEl = document.getElementById("pop");
const popCells = [".c",".l",".u",".r",".d"].map(s => popEl.querySelector(s));
const keyEls = {};
let onKey = () => {};

KEYS.forEach(k => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "key" + (k.mod || k.fn ? " fn" : ""); b.dataset.id = k.id;
  b.textContent = k.label || k.c[0];
  b.setAttribute("aria-label", k.label || k.c.filter(Boolean).join(""));
  b.tabIndex = -1;                                    // フリックは指（マウス）専用
  kbdEl.appendChild(b); keyEls[k.id] = b; b._def = k;
});

const presses = new Map();
let popOwner = null;
function dirOf(p, x, y) {
  const dx = x - p.x, dy = y - p.y;
  if (Math.hypot(dx, dy) < 18) return 0;
  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 3) : (dy < 0 ? 2 : 4);
}
function showPop(p) {
  const r = p.el.getBoundingClientRect();
  const cell = Math.max(44, Math.min(60, r.height * 1.02));
  popEl.style.setProperty("--cell", cell + "px");
  const w = cell * 3;
  const left = Math.min(Math.max(4, r.left + r.width/2 - w/2), innerWidth - w - 4);
  const top = Math.max(4, r.top + r.height/2 - w/2);
  popEl.style.left = left + "px"; popEl.style.top = top + "px";
  popEl.classList.toggle("mod", !!p.def.mod);
  popCells.forEach((c, i) => { c.textContent = p.def.c[i]; });
  popEl.hidden = false; popOwner = p; markPop(p.dir);
}
function markPop(dir) { popCells.forEach((c, i) => c.classList.toggle("hit", i === dir && !!c.textContent)); }
function hidePop(p) {
  if (popOwner !== p) return;
  popEl.hidden = true; popOwner = null;
  const rest = [...presses.values()].pop();          // まだ押さえている指があればそちらを出し直す
  if (rest) showPop(rest);
}

kbdEl.addEventListener("pointerdown", e => {
  const el = e.target.closest(".key"); if (!el) return;
  e.preventDefault();
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  const p = {el, def: el._def, x: e.clientX, y: e.clientY, dir: 0};
  presses.set(e.pointerId, p); el.classList.add("down"); showPop(p);
  Sfx.unlock();
});
kbdEl.addEventListener("pointermove", e => {
  const p = presses.get(e.pointerId); if (!p) return;
  const d = dirOf(p, e.clientX, e.clientY);
  if (d !== p.dir) { p.dir = d; if (popOwner === p) markPop(d); }
});
function endPress(e, fire) {
  const p = presses.get(e.pointerId); if (!p) return;
  presses.delete(e.pointerId); p.el.classList.remove("down"); hidePop(p);
  if (!fire) return;
  const d = dirOf(p, e.clientX, e.clientY);
  if (p.def.mod) { const m = MOD_MODES[d]; if (m) onKey({type:"mod", mode:m}); }
  else { const ch = p.def.c[d]; if (ch) onKey({type:"kana", ch}); }
}
kbdEl.addEventListener("pointerup", e => endPress(e, true));
kbdEl.addEventListener("pointercancel", e => endPress(e, false));
kbdEl.addEventListener("contextmenu", e => e.preventDefault());

let hintEl = null;
function setHint(id, dir) {
  if (hintEl) { hintEl.classList.remove("hint"); hintEl.querySelector(".hint-dir")?.remove(); hintEl = null; }
  if (!id) return;
  hintEl = keyEls[id]; hintEl.classList.add("hint");
  if (dir) { const s = document.createElement("span"); s.className = "hint-dir"; s.textContent = DIR_ARROW[dir]; hintEl.appendChild(s); }
}
</script>
